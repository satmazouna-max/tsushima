name: Build ABOUBAKTV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # السطر السحري: يصنع ملفات نظام البناء الناقصة تلقائياً
      - name: Generate Missing Gradle Wrapper
        run: wget https://githubusercontent.com && wget https://githubusercontent.com.bat && mkdir -p gradle/wrapper && wget -O gradle/wrapper/gradle-wrapper.jar https://githubusercontent.com && wget -O gradle/wrapper/gradle-wrapper.properties https://githubusercontent.com

      - name: Update Gradle Version
        run: |
          chmod +x gradlew || true
          ./gradlew wrapper --gradle-version 7.4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ABOUBAKTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
