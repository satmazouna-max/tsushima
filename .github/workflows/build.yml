name: Build ABOUBAKTV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # تفعيل الجافا 17 المتوافقة
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # السطر السحري: إجبار السيرفر على إنشاء مجلد app الافتراضي وفتح صلاحيات الكتابة
      - name: Fix Missing Directories
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/example/android/tvleanback/data
          chmod -R 777 .

      # بناء التطبيق مباشرة بأحدث الأدوات
      - name: Build Debug APK
        run: |
          npm install -g gradle || true
          gradle wrapper --gradle-version 7.4
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ABOUBAKTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
